name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version tag (e.g. v0.2.0). Leave empty to just build."
        required: false
        default: ""

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        # Default generator = newest Visual Studio on the runner.
        run: cmake -S . -B build -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build --config Release
      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: cmake --install build --config Release --prefix dist
      - name: Add readme
        shell: pwsh
        run: Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: LumaBridge-${{ matrix.arch }}
          path: dist/

  core-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build && cmake --build build && ctest --test-dir build --output-on-failure

  # Pushing a tag like v0.2.0, pushing a commit titled "Release v0.2.0" to main, or running
  # this workflow from the Actions tab with a release_version, publishes a GitHub Release
  # with one ready-to-use zip:
  # the x64 build's layout (app, integrations\, tools\, scripts\) plus the 32-bit
  # game DLLs in integrations\x86\ (the install scripts pick them up from there).
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_version != '') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))
    needs: [windows, core-tests-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Work out the tag
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then TAG="$INPUT_VERSION"
          elif [ "$EVENT" = push ] && [[ "$REF_NAME" != v* ]]; then
            # A "Release vX.Y.Z" commit on main: the tag comes from its title.
            TAG=$(printf '%s' "$MESSAGE" | head -n 1 | sed -nE 's/^Release (v[0-9]+\.[0-9]+\.[0-9]+).*$/\1/p')
          else TAG="$REF_NAME"; fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "No release tag in '$TAG'"; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 1; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Assemble zip
        run: |
          mkdir -p "pkg/LumaBridge"
          cp -r artifacts/LumaBridge-x64/. "pkg/LumaBridge/"
          mkdir -p "pkg/LumaBridge/integrations/x86"
          cp artifacts/LumaBridge-Win32/integrations/*.dll "pkg/LumaBridge/integrations/x86/"
          (cd pkg && zip -r -9 "../LumaBridge-${TAG}.zip" LumaBridge)
          ls -l "LumaBridge-${TAG}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${TAG}.md"
          # --target creates the tag at this commit when it doesn't exist yet.
          ARGS=(--title "LumaBridge ${TAG}" --target "$GITHUB_SHA")
          if [ -f "$NOTES" ]; then ARGS+=(--notes-file "$NOTES"); else ARGS+=(--generate-notes); fi
          # 0.x versions are marked as pre-releases until verified on real hardware.
          case "$TAG" in v0.*) ARGS+=(--prerelease) ;; esac
          gh release create "$TAG" "LumaBridge-${TAG}.zip" "${ARGS[@]}"
